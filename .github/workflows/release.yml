# Publish to npm through npm trusted publishing (OIDC): no npm token is
# stored in this repository. The package's trusted publisher on npmjs.com must
# name this repository and this workflow file (`release.yml`); if it also names
# an environment, add the same `environment:` here.
#
# Creating a GitHub Release publishes the tag it points at, so tag `v<version>`
# with exactly the version in package.json.
name: release

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 24 ships npm >= 11.5.1, the floor for trusted publishing.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} does not match package.json version ${version}"
            exit 1
          fi

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      # `@deepseek-ai/*` is a runtime peer the host provides, not a dependency of
      # this plugin, so `npm ci` installs no types for it. Install the matching
      # host once into a scratch prefix, then let the linker point node_modules at
      # that tree — the same script a developer runs against .dsh-dev.
      - name: Install DSH type runtime
        run: npm install --prefix .dsh-types --no-audit --no-fund @deepseek-ai/dsh@0.2.2-rc.2

      - name: Link DSH type tree
        run: node scripts/link-dsh-types.mjs --from .dsh-types/node_modules/@deepseek-ai

      # The shipped lib/ is committed. Rebuilding proves the artifacts still
      # match the sources: a stale lib/ would publish code nobody reviewed.
      - name: Rebuild lib/
        run: npm run build

      - name: Fail on artifact drift
        run: |
          git add -A -- lib
          if ! git diff --exit-code --cached -- lib/; then
            echo '::error::lib/ is out of date; run npm run build and commit the result'
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Publish
        run: npm publish --provenance --access public
